<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#1C2541" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="waGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowGreenHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34D399" />
    </marker>
  </defs>

  <rect width="1200" height="700" rx="16" fill="url(#archBg)" />

  <!-- Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">T.ask — System Architecture Diagram</text>
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Layered Client-Server, AI &amp; Messaging Architecture</text>
  </g>

  <!-- Layer 1: Presentation Layer (Left) -->
  <g transform="translate(60, 110)">
    <rect width="250" height="520" rx="14" fill="#131E3A" stroke="#2563EB" stroke-width="1.5" />
    <rect width="250" height="42" rx="14" fill="url(#clientGrad)" />
    <text x="125" y="26" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">PRESENTATION LAYER</text>

    <!-- Sub components inside Presentation -->
    <g transform="translate(20, 65)">
      <rect width="210" height="90" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="105" y="28" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#38BDF8" text-anchor="middle">Flutter Mobile Client</text>
      <text x="105" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Riverpod State Management</text>
      <text x="105" y="68" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">GoRouter Modular Navigation</text>
    </g>

    <g transform="translate(20, 175)">
      <rect width="210" height="150" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="105" y="26" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">Feature Screens</text>
      <text x="20" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#CBD5E1">• Splash &amp; Branding</text>
      <text x="20" y="74" font-family="'Segoe UI', sans-serif" font-size="11" fill="#CBD5E1">• Auth (JWT Login / Reg)</text>
      <text x="20" y="96" font-family="'Segoe UI', sans-serif" font-size="11" fill="#CBD5E1">• Dashboard (Stat Counters)</text>
      <text x="20" y="118" font-family="'Segoe UI', sans-serif" font-size="11" fill="#CBD5E1">• Meeting Creation &amp; Tracker</text>
      <text x="20" y="140" font-family="'Segoe UI', sans-serif" font-size="11" fill="#CBD5E1">• Task Details &amp; Status</text>
    </g>

    <g transform="translate(20, 345)">
      <rect width="210" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="105" y="28" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC" text-anchor="middle">Network &amp; Storage</text>
      <text x="105" y="50" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Dio Interceptor + SharedPreferences</text>
    </g>

    <g transform="translate(20, 435)">
      <rect width="210" height="65" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1" />
      <text x="105" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle">User / Employee</text>
      <text x="105" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#A7F3D0" text-anchor="middle">Android / Mobile Device</text>
    </g>
  </g>

  <!-- Connectors from Layer 1 to Layer 2 -->
  <path d="M 310 240 L 410 240" fill="none" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowHead)" />
  <text x="360" y="230" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">HTTPS / REST</text>

  <!-- Layer 2: Backend Application Layer (Center) -->
  <g transform="translate(420, 110)">
    <rect width="360" height="520" rx="14" fill="#131E3A" stroke="#6366F1" stroke-width="1.5" />
    <rect width="360" height="42" rx="14" fill="url(#serverGrad)" />
    <text x="180" y="26" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">BACKEND APPLICATION LAYER (FastAPI)</text>

    <!-- Sub components inside Backend -->
    <g transform="translate(20, 65)">
      <rect width="320" height="85" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1" />
      <text x="20" y="26" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#A5B4FC">REST API Endpoints</text>
      <text x="20" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• /api/auth (Register, Login, /me)</text>
      <text x="20" y="68" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• /api/meetings (Create, Process, Stats)</text>
      <text x="180" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• /api/tasks (List, Update)</text>
      <text x="180" y="68" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• /api/webhooks/whatsapp</text>
    </g>

    <g transform="translate(20, 165)">
      <rect width="320" height="150" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="20" y="26" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Services &amp; Business Logic</text>
      <rect x="20" y="40" width="280" height="30" rx="5" fill="#0F172A" />
      <text x="35" y="60" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38BDF8">🎙️ TranscriptionService (AssemblyAI)</text>

      <rect x="20" y="76" width="280" height="30" rx="5" fill="#0F172A" />
      <text x="35" y="96" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#F472B6">🧠 AIMeetingProcessor (Google Gemini)</text>

      <rect x="20" y="112" width="280" height="30" rx="5" fill="#0F172A" />
      <text x="35" y="132" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34D399">💬 WhatsAppService (Cloud API &amp; Webhook)</text>
    </g>

    <g transform="translate(20, 330)">
      <rect width="320" height="75" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="20" y="26" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Security &amp; Auth Core</text>
      <text x="20" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Direct bcrypt Salt Hashing</text>
      <text x="20" y="66" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• JWT OAuth2 Bearer Tokens (HS256)</text>
    </g>

    <g transform="translate(20, 420)">
      <rect width="320" height="80" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
      <text x="20" y="26" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FBBF24">Database Layer (SQLAlchemy ORM)</text>
      <text x="20" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#CBD5E1">Entities: Users, Meetings, Tasks, KeyPoints, Decisions</text>
      <text x="20" y="66" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FDE68A">Database: SQLite (Prototype) / PostgreSQL (Final)</text>
    </g>
  </g>

  <!-- Connectors from Backend to External Services (Right) -->
  <path d="M 780 230 L 880 180" fill="none" stroke="#F472B6" stroke-width="2.5" marker-end="url(#arrowHead)" />
  <path d="M 780 250 L 880 290" fill="none" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowHead)" />
  <path d="M 780 370 L 880 430" fill="none" stroke="#34D399" stroke-width="2.5" marker-end="url(#arrowGreenHead)" />
  <path d="M 880 470 L 780 470" fill="none" stroke="#34D399" stroke-width="2.5" stroke-dasharray="4" marker-end="url(#arrowGreenHead)" />
  <text x="830" y="490" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#34D399" text-anchor="middle">DONE Webhook</text>

  <!-- Layer 3: External AI & Messaging Services (Right) -->
  <g transform="translate(890, 110)">
    <!-- Service 1: AssemblyAI -->
    <g transform="translate(0, 20)">
      <rect width="250" height="95" rx="12" fill="#131E3A" stroke="#0284C7" stroke-width="1.5" />
      <rect width="250" height="30" rx="12" fill="url(#clientGrad)" />
      <text x="125" y="20" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ASSEMBLYAI CLOUD</text>
      <text x="15" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Speech-to-Text Model</text>
      <text x="15" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Speaker Diarization</text>
      <text x="15" y="88" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Audio Upload &amp; Polling</text>
    </g>

    <!-- Service 2: Google Gemini -->
    <g transform="translate(0, 135)">
      <rect width="250" height="110" rx="12" fill="#131E3A" stroke="#EC4899" stroke-width="1.5" />
      <rect width="250" height="30" rx="12" fill="url(#aiGrad)" />
      <text x="125" y="20" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">GOOGLE GEMINI 1.5</text>
      <text x="15" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Abstractive Meeting Summary</text>
      <text x="15" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Key Point &amp; Decision Mining</text>
      <text x="15" y="88" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Action Item &amp; Assignee Parsing</text>
      <text x="15" y="104" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#F472B6">• JSON Schema Enforcer</text>
    </g>

    <!-- Service 3: WhatsApp Cloud API -->
    <g transform="translate(0, 265)">
      <rect width="250" height="135" rx="12" fill="#131E3A" stroke="#10B981" stroke-width="1.5" />
      <rect width="250" height="30" rx="12" fill="url(#waGrad)" />
      <text x="125" y="20" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">META WHATSAPP API</text>
      <text x="15" y="52" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Cloud API Messaging Engine</text>
      <text x="15" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E2E8F0">• Real-Time Task Notification</text>
      <text x="15" y="90" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#34D399">• Bi-Directional Webhook:</text>
      <text x="15" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#A7F3D0">  Parses 'DONE &lt;id&gt;' reply</text>
      <text x="15" y="128" font-family="'Segoe UI', sans-serif" font-size="11" fill="#A7F3D0">  Auto-Marks Task Completed</text>
    </g>
  </g>
</svg>
